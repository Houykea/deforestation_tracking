[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deforestation"
version = "0.1.0"
description = "Deforestation tracking in Kratie, Cambodia with Sentinel-2, Google Earth Engine and Random Forest"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
